# 맥용 설치 파일(.dmg) 만들기 — 깃허브가 빌려주는 맥에서 돌아간다.
# 실행: 깃허브 저장소 → Actions → "맥 설치 파일 만들기" → Run workflow (또는 v로 시작하는 태그를 올리면 자동)
# 결과: 작업이 끝나면 같은 페이지 아래 Artifacts 에서 내려받기
#
# 애플 개발자 계정(연 99달러)이 있으면 아래 비밀값을 저장소 Settings → Secrets and variables → Actions 에 넣는다.
# 그러면 정식 서명 + 애플 공증까지 되어, 받은 dmg 하나로 경고 없이 설치된다.
#   MAC_CERT_P12_BASE64   : "Developer ID Application" 인증서(.p12)를 base64로 바꾼 글자
#   MAC_CERT_PASSWORD     : 그 .p12 의 비밀번호
#   APPLE_ID              : 개발자 계정 이메일
#   APPLE_APP_PASSWORD    : appleid.apple.com 에서 만든 "앱 암호"
#   APPLE_TEAM_ID         : 개발자 계정의 팀 ID (10글자)
# 비밀값이 없으면 임시 서명(ad-hoc)으로만 만든다 — 처음 열 때 맥이 경고한다.
name: 맥 설치 파일 만들기

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  mac:
    runs-on: macos-latest
    env:
      HAS_CERT: ${{ secrets.MAC_CERT_P12_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: 정식 서명 + 공증 빌드 (개발자 계정 비밀값이 있을 때)
        if: ${{ env.HAS_CERT == 'true' }}
        env:
          CSC_LINK: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npx electron-builder --mac --publish never -c.mac.hardenedRuntime=true -c.mac.notarize=true

      - name: 임시 서명 빌드 (비밀값이 없을 때)
        if: ${{ env.HAS_CERT != 'true' }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --mac --publish never -c.mac.identity=- -c.mac.hardenedRuntime=false

      - uses: actions/upload-artifact@v4
        with:
          name: mac-dmg
          path: dist/*.dmg
          if-no-files-found: error
